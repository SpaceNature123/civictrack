version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civictrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civictrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civictrack}
      POSTGRES_DB: ${POSTGRES_DB:-civictrack}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-civictrack} -d ${POSTGRES_DB:-civictrack}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - civictrack-net

  redis:
    image: redis:7-alpine
    container_name: civictrack-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-civictrack} --save 60 1 --loglevel warning
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-civictrack}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civictrack-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  civictrack-net:
    driver: bridge
